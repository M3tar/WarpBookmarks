<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="400" viewBox="0 0 1400 400" role="img" aria-labelledby="title desc">
  <title id="title">Warp Bookmarks — Nexus Mods header</title>
  <desc id="desc">A wide Stardew Valley scene with a parchment title block and the real Warp Bookmarks travel-book interface.</desc>
  <defs>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1e100b" stop-opacity=".94"/>
      <stop offset=".44" stop-color="#2b160e" stop-opacity=".70"/>
      <stop offset=".72" stop-color="#2b160e" stop-opacity=".05"/>
      <stop offset="1" stop-color="#2b160e" stop-opacity=".15"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0b8"/>
      <stop offset="1" stop-color="#e2ba69"/>
    </linearGradient>
    <clipPath id="canvas"><rect width="1400" height="400" rx="18"/></clipPath>
    <clipPath id="screen"><rect x="824" y="40" width="526" height="320" rx="12"/></clipPath>
  </defs>
  <g clip-path="url(#canvas)">
    <image href="../../../assets/readme/source/screenshots/v1.0.0/zh-cn/visited-map-picker.jpg" width="1400" height="400" preserveAspectRatio="xMidYMid slice"/>
    <rect width="1400" height="400" fill="url(#shade)"/>

    <g id="title-block" transform="translate(52 42)">
      <path d="M0 0h690l36 34v248l-36 34H0z" fill="url(#paper)"/>
      <path d="M14 14h664l28 27v234l-28 27H14z" fill="none" stroke="#9d5b32" stroke-width="2" opacity=".68"/>
      <text x="38" y="52" fill="#945233" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700" letter-spacing="2">A SEARCHABLE TRAVEL BOOK</text>
      <text x="38" y="133" fill="#3b2116" font-family="Georgia, Songti SC, serif" font-size="68" font-weight="700">Warp Bookmarks</text>
      <text x="40" y="182" fill="#6c3925" font-family="Songti SC, Georgia, serif" font-size="28" font-weight="700">传送书签</text>
      <text x="40" y="227" fill="#55301f" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="24">Save places · Search quickly · Warp safely</text>
      <g transform="translate(38 252)">
        <rect width="174" height="38" rx="9" fill="#4a2c20"/>
        <text x="87" y="25" text-anchor="middle" fill="#fff0bc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700">STARDEW 1.6</text>
        <rect x="186" width="136" height="38" rx="9" fill="#b7663c"/>
        <text x="254" y="25" text-anchor="middle" fill="#fff8dc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700">SMAPI MOD</text>
      </g>
    </g>

    <g id="interface-proof">
      <rect x="812" y="28" width="550" height="344" rx="18" fill="#1b0f0a" opacity=".55"/>
      <image href="../../../assets/readme/source/screenshots/v1.0.0/zh-cn/ginger-island-locked-destinations.jpg" x="824" y="40" width="526" height="320" preserveAspectRatio="xMidYMid slice" clip-path="url(#screen)"/>
      <rect x="824" y="40" width="526" height="320" rx="12" fill="none" stroke="#f2cf83" stroke-width="3"/>
      <path d="M1284 40h48v68l-24-14-24 14z" fill="#b84b32"/>
    </g>
  </g>
</svg>
