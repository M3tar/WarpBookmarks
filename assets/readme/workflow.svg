<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-labelledby="title desc">
  <title id="title">Warp Bookmarks safe travel flow</title>
  <desc id="desc">Choose a saved bookmark or coordinates, validate access, find a safe tile, then warp and remember the departure point.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1bd"/>
      <stop offset="1" stop-color="#e8c679"/>
    </linearGradient>
    <pattern id="speckle" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="6" r="1.1" fill="#7b4928" opacity=".11"/>
      <circle cx="22" cy="18" r=".8" fill="#7b4928" opacity=".09"/>
    </pattern>
  </defs>
  <rect width="1200" height="270" rx="24" fill="url(#paper)"/>
  <rect width="1200" height="270" rx="24" fill="url(#speckle)"/>
  <path d="M48 54h1104" stroke="#9d5b32" stroke-width="2" opacity=".45"/>
  <text x="58" y="39" fill="#8b4a2d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700" letter-spacing="2">EVERY ENTRANCE SHARES THE SAME SAFETY CHECK</text>

  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">
    <g transform="translate(58 90)">
      <circle cx="38" cy="38" r="38" fill="#4a2c20"/>
      <text x="38" y="48" text-anchor="middle" fill="#fff0bc" font-size="30" font-weight="700">1</text>
      <text x="0" y="112" fill="#3b2116" font-size="25" font-weight="700">选择目的地</text>
      <text x="0" y="143" fill="#70452e" font-size="19">书签、默认地点或坐标</text>
    </g>
    <path d="M276 128h74m-18-15 18 15-18 15" fill="none" stroke="#b7663c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(382 90)">
      <circle cx="38" cy="38" r="38" fill="#8f4f31"/>
      <text x="38" y="48" text-anchor="middle" fill="#fff0bc" font-size="30" font-weight="700">2</text>
      <text x="0" y="112" fill="#3b2116" font-size="25" font-weight="700">验证访问</text>
      <text x="0" y="143" fill="#70452e" font-size="19">地图、状态与边界</text>
    </g>
    <path d="M594 128h74m-18-15 18 15-18 15" fill="none" stroke="#b7663c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(700 90)">
      <circle cx="38" cy="38" r="38" fill="#b7663c"/>
      <text x="38" y="48" text-anchor="middle" fill="#fff8dc" font-size="30" font-weight="700">3</text>
      <text x="0" y="112" fill="#3b2116" font-size="25" font-weight="700">寻找安全格</text>
      <text x="0" y="143" fill="#70452e" font-size="19">阻挡时检查附近三格</text>
    </g>
    <path d="M918 128h74m-18-15 18 15-18 15" fill="none" stroke="#b7663c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(1024 90)">
      <circle cx="38" cy="38" r="38" fill="#667f3f"/>
      <text x="38" y="48" text-anchor="middle" fill="#fff8dc" font-size="30" font-weight="700">4</text>
      <text x="0" y="112" fill="#3b2116" font-size="25" font-weight="700">传送并记录</text>
      <text x="0" y="143" fill="#70452e" font-size="19">保留上一个位置</text>
    </g>
  </g>
</svg>
